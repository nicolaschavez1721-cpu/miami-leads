name: Scrape Miami-Dade Leads

on:
  schedule:
    - cron: "0 7 * * *"   # 3:00 AM ET (EDT) daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Week number (parcel cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The full parcel roll (~943k parcels) is downloaded once a week and cached here
      - name: Restore parcel database
        id: parcels
        uses: actions/cache/restore@v4
        with:
          path: data/pa_parcels.sqlite
          key: parcels-${{ steps.week.outputs.week }}
          restore-keys: parcels-

      - name: Run scraper
        run: python scraper/fetch.py
        env:
          PYTHONUNBUFFERED: "1"
          LOOKBACK_DAYS: "7"
          CLERK_EMAIL: ${{ secrets.CLERK_EMAIL }}
          CLERK_PASSWORD: ${{ secrets.CLERK_PASSWORD }}
          CLERK_SESSION: ${{ secrets.CLERK_SESSION }}

      # Save the parcel DB even if the clerk step failed, so it isn't re-downloaded
      - name: Save parcel database
        if: always() && steps.parcels.outputs.cache-hit != 'true' && hashFiles('data/pa_parcels.sqlite') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/pa_parcels.sqlite
          key: parcels-${{ steps.week.outputs.week }}

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show result summary
        if: success()
        run: |
          python3 -c "import json; d=json.load(open('data/records.json')); print('Total:', d['total'], '| With address:', d['with_address'], '| With mail:', d.get('with_mail'))"

      - name: Commit and push results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A dashboard/records.json data/records.json data/ghl_export_*.csv
          COUNT=$(python3 -c "import json; print(json.load(open('data/records.json'))['total'])")
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-scrape $(date -u +%Y-%m-%d) - ${COUNT} records"
            git pull --rebase --autostash origin main
            git push
          fi

  deploy-pages:
    needs: scrape
    if: always()
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
